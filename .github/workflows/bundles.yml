name: bundles

# Generated by kyle-lt/OtelSiteExtension (build/install/public/); edits here are overwritten.
#
# Publishes each pinned Linux bundle in linux/bundles.json as a release of this repository (#34),
# byte-identical to the distribution's own release asset (release-bundles.sh checks the sha256).
# The installers here download it from that release, so its public download count counts installs.
#
# Runs when the build publishes here. It is idempotent: a bundle already released is left alone.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # create the releases and upload their assets

concurrency:
  group: bundles
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Release each pinned bundle that isn't released yet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/release-bundles.sh linux/bundles.json
